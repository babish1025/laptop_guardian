name: laptop_guardian_mobile
description: Laptop Guardian — Remote monitor and control for your laptop.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.1.0

  # Secure local storage (auth token)
  flutter_secure_storage: ^9.0.0

  # State management
  provider: ^6.1.1

  # Date formatting
  intl: ^0.19.0

  # Open URLs (Google Maps, etc.)
  url_launcher: ^6.2.1

  # Shared preferences (non-sensitive settings)
  shared_preferences: ^2.2.2

  # App icons / material extras
  cupertino_icons: ^1.0.2

  # Firebase Cloud Messaging & Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
